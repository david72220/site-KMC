<rect x="280" y="75" width="460" height="90" rx="8" fill="#22c55e0A" stroke="#22c55e44" stroke-width="1.5"/><text x="295" y="107" fill="#22c55e" font-family="Space Grotesk,system-ui" font-size="20" font-weight="800">FTTH</text><text x="295" y="127" fill="#f8fafc" font-family="system-ui" font-size="11" font-weight="600">Fiber To The Home</text><text x="295" y="145" fill="#94a3b8" font-family="system-ui" font-size="10">Fibre jusqu'à la prise</text><text x="295" y="159" fill="#94a3b8" font-family="system-ui" font-size="10">murale du logement</text><text x="580" y="125" text-anchor="middle" fill="#22c55e" font-family="system-ui" font-size="11" font-weight="600">Meilleur débit</text><text x="580" y="141" text-anchor="middle" fill="#22c55e" font-family="system-ui" font-size="11" font-weight="600">100 Mbit/s – 1 Gbit/s</text><rect x="280" y="200" width="460" height="90" rx="8" fill="#F59E0B0A" stroke="#F59E0B44" stroke-width="1.5"/><text x="295" y="232" fill="#F59E0B" font-family="Space Grotesk,system-ui" font-size="20" font-weight="800">FTTO</text><text x="295" y="252" fill="#f8fafc" font-family="system-ui" font-size="11" font-weight="600">Fiber To The Office</text><text x="295" y="270" fill="#94a3b8" font-family="system-ui" font-size="10">Fibre jusqu'au</text><text x="295" y="284" fill="#94a3b8" font-family="system-ui" font-size="10">local technique bureau</text><text x="580" y="250" text-anchor="middle" fill="#F59E0B" font-family="system-ui" font-size="11" font-weight="600">Dédié entreprises</text><text x="580" y="266" text-anchor="middle" fill="#F59E0B" font-family="system-ui" font-size="11" font-weight="600">SLA garanti</text><rect x="280" y="315" width="460" height="90" rx="8" fill="#94a3b80A" stroke="#94a3b844" stroke-width="1.5"/><text x="295" y="347" fill="#94a3b8" font-family="Space Grotesk,system-ui" font-size="20" font-weight="800">FTTB</text><text x="295" y="367" fill="#f8fafc" font-family="system-ui" font-size="11" font-weight="600">Fiber To The Building</text><text x="295" y="385" fill="#94a3b8" font-family="system-ui" font-size="10">Fibre au pied</text><text x="295" y="399" fill="#94a3b8" font-family="system-ui" font-size="10">de l'immeuble</text><text x="580" y="365" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="11" font-weight="600">Puis câble cuivre</text><text x="580" y="381" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="11" font-weight="600">par étage (VDSL2)</text><text x="400" y="460" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="12">En Côte d'Ivoire : FTTH dominant dans les zones urbaines d'Abidjan, FTTB dans les immeubles résidentiels</text>
