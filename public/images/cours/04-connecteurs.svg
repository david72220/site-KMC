<defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0L0 0 0 40" fill="none" stroke="rgba(59,151,211,0.06)" stroke-width="1"/></pattern></defs><rect width="800" height="500" fill="url(#g)"/>
<text x="400" y="45" text-anchor="middle" fill="#f8fafc" font-family="Space Grotesk,system-ui" font-size="20" font-weight="700">Types de connecteurs fibre optique</text><rect x="15" y="80" width="130" height="300" rx="10" fill="#3b97d312" stroke="#3b97d344" stroke-width="1.5"/><rect x="50" y="100" width="60" height="80" rx="6" fill="#3b97d3" opacity="0.7"/><circle cx="80" cy="140" r="15" fill="#0B1120"/><circle cx="80" cy="140" r="8" fill="#3b97d3" opacity="0.5"/><rect x="74" y="180" width="12" height="20" rx="2" fill="#3b97d3" opacity="0.9"/><text x="80" y="225" text-anchor="middle" fill="#f8fafc" font-family="Space Grotesk,system-ui" font-size="20" font-weight="800">SC</text><text x="80" y="248" text-anchor="middle" fill="#3b97d3" font-family="system-ui" font-size="11" font-weight="600">Subscriber Connector</text><text x="80" y="272" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="10">Clipsage</text><text x="80" y="287" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="10">push-pull</text><text x="80" y="320" text-anchor="middle" fill="#F59E0B" font-family="system-ui" font-size="10">Réseau FTTH</text><text x="80" y="335" text-anchor="middle" fill="#F59E0B" font-family="system-ui" font-size="10">Opérateurs CI</text><rect x="180" y="80" width="130" height="300" rx="10" fill="#3b97d312" stroke="#3b97d344" stroke-width="1.5"/><rect x="215" y="100" width="60" height="80" rx="6" fill="#3b97d3" opacity="0.7"/><circle cx="245" cy="140" r="15" fill="#0B1120"/><circle cx="245" cy="140" r="8" fill="#3b97d3" opacity="0.5"/><rect x="239" y="180" width="12" height="20" rx="2" fill="#3b97d3" opacity="0.9"/><text x="245" y="225" text-anchor="middle" fill="#f8fafc" font-family="Space Grotesk,system-ui" font-size="20" font-weight="800">LC</text><text x="245" y="248" text-anchor="middle" fill="#3b97d3" font-family="system-ui" font-size="11" font-weight="600">Lucent Connector</text><text x="245" y="272" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="10">Petit format</text><text x="245" y="287" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="10">(1,25 mm)</text><text x="245" y="320" text-anchor="middle" fill="#F59E0B" font-family="system-ui" font-size="10">Équipements</text><text x="245" y="335" text-anchor="middle" fill="#F59E0B" font-family="system-ui" font-size="10">actifs, SFP</text><rect x="345" y="80" width="130" height="300" rx="10" fill="#3b97d312" stroke="#3b97d344" stroke-width="1.5"/><rect x="380" y="100" width="60" height="80" rx="6" fill="#3b97d3" opacity="0.7"/><circle cx="410" cy="140" r="15" fill="#0B1120"/><circle cx="410" cy="140" r="8" fill="#3b97d3" opacity="0.5"/><rect x="404" y="180" width="12" height="20" rx="2" fill="#3b97d3" opacity="0.9"/><text x="410" y="225" text-anchor="middle" fill="#f8fafc" font-family="Space Grotesk,system-ui" font-size="20" font-weight="800">ST</text><text x="410" y="248" text-anchor="middle" fill="#3b97d3" font-family="system-ui" font-size="11" font-weight="600">Straight Tip</text><text x="410" y="272" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="10">Baïonnette</text><text x="410" y="287" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="10">pour fixer</text><text x="410" y="320" text-anchor="middle" fill="#F59E0B" font-family="system-ui" font-size="10">Réseaux anciens</text><text x="410" y="335" text-anchor="middle" fill="#F59E0B" font-family="system-ui" font-size="10">LAN cuivre</text><rect x="510" y="80" width="130" height="300" rx="10" fill="#3b97d312" stroke="#3b97d344" stroke-width="1.5"/><rect x="545" y="100" width="60" height="80" rx="6" fill="#3b97d3" opacity="0.7"/><circle cx="575" cy="140" r="15" fill="#0B1120"/><circle cx="575" cy="140" r="8" fill="#3b97d3" opacity="0.5"/><rect x="569" y="180" width="12" height="20" rx="2" fill="#3b97d3" opacity="0.9"/><text x="575" y="225" text-anchor="middle" fill="#f8fafc" font-family="Space Grotesk,system-ui" font-size="20" font-weight="800">FC</text><text x="575" y="248" text-anchor="middle" fill="#3b97d3" font-family="system-ui" font-size="11" font-weight="600">Ferrule Connector</text><text x="575" y="272" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="10">Vissage</text><text x="575" y="287" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="10">rotatif</text><text x="575" y="320" text-anchor="middle" fill="#F59E0B" font-family="system-ui" font-size="10">Mesure OTDR</text><text x="575" y="335" text-anchor="middle" fill="#F59E0B" font-family="system-ui" font-size="10">Labo optique</text><text x="400" y="420" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="12">Polissage : APC (vert, angle 8°) · UPC (bleu, plat) · PC (polissage standard)</text><text x="400" y="445" text-anchor="middle" fill="#3b97d3" font-family="system-ui" font-size="12" font-weight="600">Règle : SC/APC pour les réseaux FTTH opérateurs en Côte d'Ivoire</text>
