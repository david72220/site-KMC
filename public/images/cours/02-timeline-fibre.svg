<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
<rect width="800" height="500" fill="#0B1120"/>
<defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0L0 0 0 40" fill="none" stroke="rgba(59,151,211,0.06)" stroke-width="1"/></pattern></defs><rect width="800" height="500" fill="url(#g)"/>
<text x="400" y="45" text-anchor="middle" fill="#f8fafc" font-family="Space Grotesk,system-ui" font-size="20" font-weight="700">Histoire de la fibre optique</text><line x1="60" y1="250" x2="740" y2="250" stroke="#3b97d344" stroke-width="2"/><circle cx="60" cy="250" r="7" fill="#3b97d3" stroke="#0B1120" stroke-width="2"/><line x1="60" y1="250" x2="60" y2="265" stroke="#3b97d355" stroke-width="1.5"/><text x="60" y="480" text-anchor="middle" fill="#F59E0B" font-family="Space Grotesk,system-ui" font-size="11" font-weight="700">1880</text><text x="60" y="270" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="9">Alexander Graham Bell</text><text x="60" y="283" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="9">transmet la voix par lumière</text><text x="60" y="296" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="9">(photophone)</text><circle cx="157" cy="250" r="7" fill="#3b97d3" stroke="#0B1120" stroke-width="2"/><line x1="157" y1="250" x2="157" y2="235" stroke="#3b97d355" stroke-width="1.5"/><text x="157" y="65" text-anchor="middle" fill="#F59E0B" font-family="Space Grotesk,system-ui" font-size="11" font-weight="700">1954</text><text x="157" y="80" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="9">Narinder Singh Kapany</text><text x="157" y="93" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="9">démontre la transmission</text><text x="157" y="106" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="9">en fibre de verre</text><circle cx="254" cy="250" r="7" fill="#3b97d3" stroke="#0B1120" stroke-width="2"/><line x1="254" y1="250" x2="254" y2="265" stroke="#3b97d355" stroke-width="1.5"/><text x="254" y="480" text-anchor="middle" fill="#F59E0B" font-family="Space Grotesk,system-ui" font-size="11" font-weight="700">1966</text><text x="254" y="270" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="9">Charles Kao théorise</text><text x="254" y="283" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="9">la fibre à faible perte</text><text x="254" y="296" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="9">(Prix Nobel 2009)</text><circle cx="351" cy="250" r="7" fill="#3b97d3" stroke="#0B1120" stroke-width="2"/><line x1="351" y1="250" x2="351" y2="235" stroke="#3b97d355" stroke-width="1.5"/><text x="351" y="65" text-anchor="middle" fill="#F59E0B" font-family="Space Grotesk,system-ui" font-size="11" font-weight="700">1970</text><text x="351" y="80" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="9">Première fibre</text><text x="351" y="93" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="9">< 20 dB/km</text><text x="351" y="106" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="9">(Corning Glass)</text><circle cx="448" cy="250" r="7" fill="#3b97d3" stroke="#0B1120" stroke-width="2"/><line x1="448" y1="250" x2="448" y2="265" stroke="#3b97d355" stroke-width="1.5"/><text x="448" y="480" text-anchor="middle" fill="#F59E0B" font-family="Space Grotesk,system-ui" font-size="11" font-weight="700">1988</text><text x="448" y="270" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="9">1er câble sous-marin</text><text x="448" y="283" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="9">transatlantique</text><text x="448" y="296" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="9">TAT-8 : 280 Mbit/s</text><circle cx="545" cy="250" r="7" fill="#3b97d3" stroke="#0B1120" stroke-width="2"/><line x1="545" y1="250" x2="545" y2="235" stroke="#3b97d355" stroke-width="1.5"/><text x="545" y="65" text-anchor="middle" fill="#F59E0B" font-family="Space Grotesk,system-ui" font-size="11" font-weight="700">2000</text><text x="545" y="80" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="9">Boom Internet :</text><text x="545" y="93" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="9">les réseaux fibre</text><text x="545" y="106" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="9">se multiplient</text><circle cx="642" cy="250" r="7" fill="#3b97d3" stroke="#0B1120" stroke-width="2"/><line x1="642" y1="250" x2="642" y2="265" stroke="#3b97d355" stroke-width="1.5"/><text x="642" y="480" text-anchor="middle" fill="#F59E0B" font-family="Space Grotesk,system-ui" font-size="11" font-weight="700">2010</text><text x="642" y="270" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="9">FTTH se déploie</text><text x="642" y="283" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="9">dans le monde entier</text><text x="642" y="296" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="9">100 Mbit/s → 1 Gbit/s</text><circle cx="739" cy="250" r="7" fill="#3b97d3" stroke="#0B1120" stroke-width="2"/><line x1="739" y1="250" x2="739" y2="235" stroke="#3b97d355" stroke-width="1.5"/><text x="739" y="65" text-anchor="middle" fill="#F59E0B" font-family="Space Grotesk,system-ui" font-size="11" font-weight="700">2026</text><text x="739" y="80" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="9">Côte d'Ivoire :</text><text x="739" y="93" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="9">déploiement FTTH</text><text x="739" y="106" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="9">Abidjan et villes</text>
</svg>