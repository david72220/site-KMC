<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
<rect width="800" height="500" fill="#0B1120"/>
<defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0L0 0 0 40" fill="none" stroke="rgba(59,151,211,0.06)" stroke-width="1"/></pattern></defs><rect width="800" height="500" fill="url(#g)"/>

<text x="400" y="50" text-anchor="middle" fill="#f8fafc" font-family="Space Grotesk,system-ui" font-size="20" font-weight="700">Réflexion totale interne</text>
<rect x="60" y="180" width="680" height="80" rx="40" fill="#3b97d318" stroke="#3b97d355" stroke-width="2"/>
<rect x="60" y="200" width="680" height="40" rx="20" fill="#3b97d3" opacity="0.25"/>
<text x="50" y="220" text-anchor="end" fill="#94a3b8" font-family="system-ui" font-size="11">Gaine</text>
<text x="50" y="243" text-anchor="end" fill="#3b97d3" font-family="system-ui" font-size="11">Coeur</text>
<line x1="80" y1="220" x2="200" y2="220" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arr)"/>
<line x1="200" y1="220" x2="320" y2="195" stroke="#F59E0B" stroke-width="2.5"/>
<line x1="320" y1="195" x2="440" y2="220" stroke="#F59E0B" stroke-width="2.5"/>
<line x1="440" y1="220" x2="560" y2="200" stroke="#F59E0B" stroke-width="2.5"/>
<line x1="560" y1="200" x2="680" y2="218" stroke="#F59E0B" stroke-width="2.5"/>
<defs><marker id="arr" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#F59E0B"/></marker></defs>
<circle cx="200" cy="195" r="5" fill="#3b97d3" opacity="0.8"/>
<circle cx="320" cy="195" r="5" fill="#3b97d3" opacity="0.8"/>
<circle cx="440" cy="220" r="5" fill="#3b97d3" opacity="0.8"/>
<circle cx="560" cy="200" r="5" fill="#3b97d3" opacity="0.8"/>
<text x="260" y="155" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="11">Réflexion</text>
<text x="380" y="175" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="11">Réflexion</text>
<text x="500" y="155" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="11">Réflexion</text>
<text x="400" y="320" text-anchor="middle" fill="#3b97d3" font-family="Space Grotesk,system-ui" font-size="15" font-weight="700">Principe : indice de réfraction du coeur &gt; indice de la gaine</text>
<text x="400" y="345" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="12">La lumière reste piégée dans le coeur et peut parcourir des dizaines de kilomètres</text>
<rect x="150" y="370" width="500" height="60" rx="10" fill="#3b97d311" stroke="#3b97d333" stroke-width="1"/>
<text x="400" y="397" text-anchor="middle" fill="#F59E0B" font-family="system-ui" font-size="13" font-weight="600">Analogie : un toboggan lumineux</text>
<text x="400" y="417" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="12">La lumière glisse en rebondissant sur les parois comme sur un toboggan</text>
<text x="80" y="165" fill="#F59E0B" font-family="system-ui" font-size="12" font-weight="700">Lumière entrante</text>

</svg>