<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
<rect width="800" height="480" fill="#0B1120"/>
<defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0L0 0 0 40" fill="none" stroke="rgba(59,151,211,0.06)" stroke-width="1"/></pattern></defs><rect width="800" height="480" fill="url(#g)"/>

<text x="400" y="45" text-anchor="middle" fill="#f8fafc" font-family="Space Grotesk,system-ui" font-size="20" font-weight="700">Réseau PON : OLT → Splitter → ONU/ONT</text>
<rect x="30" y="160" width="120" height="140" rx="10" fill="#3b97d322" stroke="#3b97d3" stroke-width="2"/>
<text x="90" y="200" text-anchor="middle" fill="#3b97d3" font-family="Space Grotesk,system-ui" font-size="16" font-weight="800">OLT</text>
<text x="90" y="220" text-anchor="middle" fill="#f8fafc" font-family="system-ui" font-size="10">Optical</text>
<text x="90" y="233" text-anchor="middle" fill="#f8fafc" font-family="system-ui" font-size="10">Line Terminal</text>
<text x="90" y="253" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="9">Chez l'opérateur</text>
<text x="90" y="267" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="9">au NRO</text>
<text x="90" y="285" text-anchor="middle" fill="#F59E0B" font-family="system-ui" font-size="9">1 OLT = 64–128</text>
<text x="90" y="298" text-anchor="middle" fill="#F59E0B" font-family="system-ui" font-size="9">abonnés</text>
<line x1="150" y1="230" x2="250" y2="200" stroke="#3b97d3" stroke-width="2"/>
<line x1="150" y1="230" x2="250" y2="230" stroke="#3b97d3" stroke-width="2"/>
<line x1="150" y1="230" x2="250" y2="260" stroke="#3b97d3" stroke-width="2"/>
<rect x="250" y="175" width="90" height="110" rx="8" fill="#3b97d315" stroke="#3b97d366" stroke-width="1.5"/>
<text x="295" y="215" text-anchor="middle" fill="#f8fafc" font-family="Space Grotesk,system-ui" font-size="13" font-weight="700">Splitter</text>
<text x="295" y="233" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="10">Passif</text>
<text x="295" y="248" text-anchor="middle" fill="#3b97d3" font-family="system-ui" font-size="11" font-weight="700">1→32</text>
<text x="295" y="263" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="9">Pas d'énergie</text>
<line x1="340" y1="200" x2="430" y2="135" stroke="#3b97d3" stroke-width="1.5"/>
<line x1="340" y1="210" x2="430" y2="165" stroke="#3b97d3" stroke-width="1.5"/>
<line x1="340" y1="230" x2="430" y2="230" stroke="#3b97d3" stroke-width="1.5"/>
<line x1="340" y1="250" x2="430" y2="295" stroke="#3b97d3" stroke-width="1.5"/>
<line x1="340" y1="260" x2="430" y2="325" stroke="#3b97d3" stroke-width="1.5"/>
<rect x="430" y="115" width="90" height="40" rx="6" fill="#3b97d315" stroke="#3b97d355" stroke-width="1.5"/><text x="475" y="139" text-anchor="middle" fill="#f8fafc" font-family="system-ui" font-size="11" font-weight="600">ONU</text><line x1="520" y1="135" x2="590" y2="135" stroke="#3b97d366" stroke-width="1.5"/><rect x="590" y="120" width="80" height="30" rx="5" fill="#F59E0B22" stroke="#F59E0B55" stroke-width="1.5"/><text x="630" y="139" text-anchor="middle" fill="#F59E0B" font-family="system-ui" font-size="10">Box abonné</text><rect x="430" y="145" width="90" height="40" rx="6" fill="#3b97d315" stroke="#3b97d355" stroke-width="1.5"/><text x="475" y="169" text-anchor="middle" fill="#f8fafc" font-family="system-ui" font-size="11" font-weight="600">ONU</text><line x1="520" y1="165" x2="590" y2="165" stroke="#3b97d366" stroke-width="1.5"/><rect x="590" y="150" width="80" height="30" rx="5" fill="#F59E0B22" stroke="#F59E0B55" stroke-width="1.5"/><text x="630" y="169" text-anchor="middle" fill="#F59E0B" font-family="system-ui" font-size="10">Box abonné</text><rect x="430" y="210" width="90" height="40" rx="6" fill="#3b97d315" stroke="#3b97d355" stroke-width="1.5"/><text x="475" y="234" text-anchor="middle" fill="#f8fafc" font-family="system-ui" font-size="11" font-weight="600">ONU</text><line x1="520" y1="230" x2="590" y2="230" stroke="#3b97d366" stroke-width="1.5"/><rect x="590" y="215" width="80" height="30" rx="5" fill="#F59E0B22" stroke="#F59E0B55" stroke-width="1.5"/><text x="630" y="234" text-anchor="middle" fill="#F59E0B" font-family="system-ui" font-size="10">Box abonné</text><rect x="430" y="275" width="90" height="40" rx="6" fill="#3b97d315" stroke="#3b97d355" stroke-width="1.5"/><text x="475" y="299" text-anchor="middle" fill="#f8fafc" font-family="system-ui" font-size="11" font-weight="600">ONU</text><line x1="520" y1="295" x2="590" y2="295" stroke="#3b97d366" stroke-width="1.5"/><rect x="590" y="280" width="80" height="30" rx="5" fill="#F59E0B22" stroke="#F59E0B55" stroke-width="1.5"/><text x="630" y="299" text-anchor="middle" fill="#F59E0B" font-family="system-ui" font-size="10">Box abonné</text><rect x="430" y="305" width="90" height="40" rx="6" fill="#3b97d315" stroke="#3b97d355" stroke-width="1.5"/><text x="475" y="329" text-anchor="middle" fill="#f8fafc" font-family="system-ui" font-size="11" font-weight="600">...</text><rect x="30" y="340" width="740" height="70" rx="10" fill="#3b97d308" stroke="#3b97d322" stroke-width="1"/><text x="400" y="365" text-anchor="middle" fill="#3b97d3" font-family="Space Grotesk,system-ui" font-size="13" font-weight="700">Réseau PON (Passive Optical Network)</text><text x="400" y="385" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="11">L'OLT envoie les données vers tous les ONU. Chaque ONU ne lit que ses propres données (protocole GPON).</text><text x="400" y="403" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="11">Débit descendant (download) : 2,4 Gbit/s · Débit montant (upload) : 1,2 Gbit/s (GPON)</text><rect x="30" y="425" width="200" height="40" rx="8" fill="#3b97d315" stroke="#3b97d344" stroke-width="1"/><text x="130" y="450" text-anchor="middle" fill="#f8fafc" font-family="system-ui" font-size="12" font-weight="600">OLT → NRO opérateur</text><rect x="295" y="425" width="200" height="40" rx="8" fill="#3b97d310" stroke="#3b97d333" stroke-width="1"/><text x="395" y="450" text-anchor="middle" fill="#f8fafc" font-family="system-ui" font-size="12">Splitter → SRO/PBO</text><rect x="560" y="425" width="210" height="40" rx="8" fill="#F59E0B10" stroke="#F59E0B33" stroke-width="1"/><text x="665" y="450" text-anchor="middle" fill="#f8fafc" font-family="system-ui" font-size="12">ONU/ONT → domicile</text>
</svg>