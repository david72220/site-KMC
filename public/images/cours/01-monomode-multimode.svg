<text x="595" y="365" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="12" font-weight="600">Couleur du câble</text>
<text x="595" y="385" text-anchor="middle" fill="#F59E0B" font-family="system-ui" font-size="13">Orange / Turquoise</text>
<text x="205" y="400" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="11">Usage : longues distances, opérateurs</text>
<text x="595" y="400" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="11">Usage : bâtiments, campus, data center</text>
<text x="400" y="465" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="12">Monomode = 1 mode de lumière · Multimode = plusieurs modes simultanés</text>

