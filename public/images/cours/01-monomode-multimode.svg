<text x="205" y="140" text-anchor="middle" fill="#3b97d3" font-family="Space Grotesk,system-ui" font-size="18" font-weight="800">Monomode (SMF)</text>
<text x="595" y="140" text-anchor="middle" fill="#F59E0B" font-family="Space Grotesk,system-ui" font-size="18" font-weight="800">Multimode (MMF)</text>
