<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
<rect width="800" height="500" fill="#0B1120"/>
<defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0L0 0 0 40" fill="none" stroke="rgba(59,151,211,0.06)" stroke-width="1"/></pattern></defs><rect width="800" height="500" fill="url(#g)"/>

<text x="400" y="50" text-anchor="middle" fill="#f8fafc" font-family="Space Grotesk,system-ui" font-size="20" font-weight="700">Structure d'une fibre optique</text>
<circle cx="250" cy="260" r="150" fill="#3b97d318" stroke="#3b97d355" stroke-width="3"/>
<circle cx="250" cy="260" r="100" fill="#3b97d330" stroke="#3b97d388" stroke-width="3"/>
<circle cx="250" cy="260" r="40"  fill="#3b97d3" opacity="0.8"/>
<text x="250" y="266" text-anchor="middle" fill="#f8fafc" font-family="system-ui" font-size="13" font-weight="700">COEUR</text>
<text x="250" y="283" text-anchor="middle" fill="#f8fafc" font-family="system-ui" font-size="10">8–62 µm</text>
<line x1="250" y1="220" x2="250" y2="160" stroke="#3b97d366" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="252" y="158" fill="#94a3b8" font-family="system-ui" font-size="11">Coeur (core)</text>
<line x1="340" y1="230" x2="420" y2="180" stroke="#3b97d366" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="422" y="178" fill="#3b97d3" font-family="system-ui" font-size="11">Gaine (cladding)</text>
<line x1="380" y1="290" x2="450" y2="290" stroke="#3b97d344" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="452" y="295" fill="#94a3b8" font-family="system-ui" font-size="11">Revêtement protecteur</text>
<rect x="520" y="100" width="230" height="300" rx="12" fill="#3b97d30A" stroke="#3b97d322" stroke-width="1"/>
<text x="635" y="135" text-anchor="middle" fill="#3b97d3" font-family="Space Grotesk,system-ui" font-size="14" font-weight="700">Propriétés</text>
<text x="535" y="165" fill="#94a3b8" font-family="system-ui" font-size="12" font-weight="600">Coeur</text>
<text x="535" y="183" fill="#f8fafc" font-family="system-ui" font-size="11">Silice pure (SiO₂)</text>
<text x="535" y="200" fill="#f8fafc" font-family="system-ui" font-size="11">Indice de réfraction élevé</text>
<text x="535" y="225" fill="#94a3b8" font-family="system-ui" font-size="12" font-weight="600">Gaine</text>
<text x="535" y="243" fill="#f8fafc" font-family="system-ui" font-size="11">Silice moins dense</text>
<text x="535" y="260" fill="#f8fafc" font-family="system-ui" font-size="11">Indice de réfraction faible</text>
<text x="535" y="285" fill="#94a3b8" font-family="system-ui" font-size="12" font-weight="600">Revêtement</text>
<text x="535" y="303" fill="#f8fafc" font-family="system-ui" font-size="11">Plastique acrylate</text>
<text x="535" y="320" fill="#f8fafc" font-family="system-ui" font-size="11">Protection mécanique</text>
<text x="535" y="345" fill="#94a3b8" font-family="system-ui" font-size="12" font-weight="600">Diamètre total</text>
<text x="535" y="363" fill="#f8fafc" font-family="system-ui" font-size="11">125 µm (gaine)</text>
<text x="535" y="380" fill="#f8fafc" font-family="system-ui" font-size="11">250 µm (revêtement)</text>
<text x="400" y="470" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="12">La fibre optique est plus fine qu'un cheveu humain (~70 µm de diamètre)</text>

</svg>